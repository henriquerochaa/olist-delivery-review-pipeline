[project]
name = "projeto1-pipeline-qualidade-dados"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dbt-duckdb>=1.11.1",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
olist-bronze = "projeto1_pipeline_qualidade_dados.bronze:main"
olist-publish = "projeto1_pipeline_qualidade_dados.publish:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "ty>=0.0.91",
]
