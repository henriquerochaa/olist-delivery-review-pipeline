contract_version: 1
scope: olist_mvp
source_directory: ../dataset-ecommerce-brasil
required_columns_policy: all columns listed in columns are required; missing any required
  column fails ingestion
extra_columns_policy: accept and preserve all extra source columns
source_rows_policy: preserve every source row; never silently drop rows
identifier_policy: read IDs and postal code prefixes as strings
datetime_policy: logical type is timestamp without timezone; preserve original source
  text in Bronze and do not assign a timezone
null_policy: preserve allowed source nulls; nulls in non-nullable columns are blocking
  validation errors that stop downstream processing; report the issue without silently
  dropping the source row
source_file: olist_order_reviews_dataset.csv
grain: one source review record; do not aggregate in Bronze
primary_key:
- order_id
- review_id
columns:
  review_id:
    logical_type: string
    nullable: false
    bronze_representation: string_preserved_from_source
  order_id:
    logical_type: string
    nullable: false
    bronze_representation: string_preserved_from_source
  review_score:
    logical_type: integer
    nullable: false
    bronze_representation: string_preserved_from_source
  review_comment_title:
    logical_type: string
    nullable: true
    bronze_representation: string_preserved_from_source
  review_comment_message:
    logical_type: string
    nullable: true
    bronze_representation: string_preserved_from_source
  review_creation_date:
    logical_type: timestamp_without_timezone
    nullable: false
    bronze_representation: string_preserved_from_source
  review_answer_timestamp:
    logical_type: timestamp_without_timezone
    nullable: false
    bronze_representation: string_preserved_from_source
row_policy: preserve all source rows; do not deduplicate
quality_observations:
  review_id_repeats: record as a quality observation; review_id is not unique by itself
  composite_key:
  - order_id
  - review_id
  multiple_reviews_per_order: preserve at this grain; aggregation is a later Silver/Gold
    decision
